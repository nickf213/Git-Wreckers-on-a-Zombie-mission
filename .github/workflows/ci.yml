name: Java CI

on:
  push:

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java project
        working-directory: COMP2000
        run: |
          mkdir -p out
          javac -d out src/*.java

      - name: Compile and run tests
        working-directory: COMP2000
        run: |
          javac -cp out -d out test/*.java
          # REVIEW: only HumanFoodTest runs here. Add each new test class (e.g. a Zombie test) as another java -ea line.
          java -ea -cp "out:src" HumanFoodTest